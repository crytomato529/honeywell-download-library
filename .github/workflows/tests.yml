name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-inspection.txt
      - run: python -B -m unittest discover -s scripts -p "test_*.py"
      - run: python -B scripts/manual_watch.py plan --config references/honeywell.example.json --out web-query-plan.json
